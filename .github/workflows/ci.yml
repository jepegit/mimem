name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Fail fast rather than silently falling back to a system interpreter.
  UV_PYTHON_DOWNLOADS: automatic

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # `uv sync` builds a project-local .venv from uv.lock, so CI runs the exact
      # resolution that is committed. `--locked` fails if pyproject.toml and uv.lock
      # have drifted, which is the check we actually want on a PR.
      - name: Install
        run: uv sync --all-extras --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov=mimem --cov-report=term-missing

      # The documentation is part of the product, and a broken cross-reference in it is a
      # defect like any other. Building on Linux only: the output is identical and this is
      # about catching bad links, not platform differences.
      - name: Build the documentation
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: uv run zensical build --clean
