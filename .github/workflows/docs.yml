name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a queued run supersedes a running one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  UV_PYTHON_DOWNLOADS: automatic

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install
        run: uv sync --all-extras --locked

      - name: Build
        run: uv run zensical build --clean

      # `enablement` turns Pages on the first time this runs, so that publishing the site is a
      # reviewable line in the repository rather than a settings change nobody can see. It is a
      # no-op on every subsequent run.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
