# Copy to listener.yaml (git-ignored) and edit. Point mimem at it with --listener or
# MIMEM_LISTENER_FILE.
#
# This is the single biggest quality lever for a domain specialist: it is what stops the
# system explaining "electrolyte" to you for the hundredth time.

name: jepe
default_expertise: familiar

# Domain -> novice | familiar | expert. Shifts difficulty scores (rule DIF-04), which in turn
# decides who gets a gloss, an anchor, and extra repetitions.
expertise:
  electrochemistry: expert
  battery-materials: expert
  materials-science: familiar
  machine-learning: familiar
  statistics: familiar
  biology: novice

# What vocabulary belongs to each domain above. Without this, expertise does nothing: no
# concept in a real paper is called "electrochemistry", so every one of them would fall back to
# the default level and declaring yourself an expert would change no ranking at all.
domain_terms:
  electrochemistry:
    - cell
    - electrode
    - anode
    - cathode
    - electrolyte
    - lithium
    - capacity
    - voltage
    - current
    - charge
    - discharge
    - cycling
    - interphase
    - impedance
  battery-materials:
    - graphite
    - silicon
    - NMC
    - LFP
    - separator
    - binder
    - active material
    - jelly roll
    - prismatic
    - cylindrical
  machine-learning:
    - model
    - training
    - dataset
    - hyperparameter
    - regression
    - neural
    - prediction
    - feature

# Terms you never need explained, whatever the difficulty model thinks.
# A term here also makes any compound containing it easier: knowing "anode" makes
# "anode active material" less new ground, even though you never listed the compound.
known_terms:
  - electrolyte
  - anode
  - cathode
  - coulombic efficiency
  - cyclic voltammetry
  - state of charge

# Spoken forms for things a TTS engine will mangle (rule SYM-03). Left side is matched
# case-insensitively against the source text.
lexicon:
  SEI: "S E I"
  NMC811: "N M C eight one one"
  LiPF6: "lithium hexafluorophosphate"
  dQ/dV: "d Q by d V"
  Li-ion: "lithium ion"
  cellpy: "cell pie"
  # Model designations are read digit by digit by default ("four six eight zero").
  # Override them here when the field says them differently.
  "4680": "forty six eighty"
  "18650": "eighteen six fifty"

# Optional: overrides the profile's narration rate.
# wpm: 160
