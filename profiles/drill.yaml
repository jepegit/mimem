# For material you have to actually own -- a paper you will build on, referee, or defend.
name: drill
description: >
  Long pass. Two prompts per segment, up to five spaced exposures, doubled review block,
  attributed citations because provenance matters at this depth.

wpm: 150
duration_multiplier: 2.2

segments:
  target_min: 40
  target_max: 75
  hard_max: 100

pauses:
  retrieval_min: 4.0
  retrieval_max: 8.0
  imagery_min: 2.5
  imagery_max: 5.0
  segment_boundary: 1.5
  section_boundary: 2.5

prompts_per_segment: 2
min_prompts_per_section: 2
prequestions_per_document: 4
prequestions_per_section: 2

spacing:
  min_gap_minutes: 3.0
  interval_ratio: 2.2
  repetitions_min: 3
  repetitions_max: 5

review_block_multiplier: 2.0
max_preload_terms: 7
max_new_terms_per_segment: 2
emphasis_markers_per_section: 1

numeric_fidelity: exact
speak_statistics_verdict: true
citations: attributed
