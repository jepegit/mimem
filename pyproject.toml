[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimem"
version = "0.1.0"
description = "Convert your library into audio that is designed for remembering"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Jan Petter Maehlen" }]
keywords = ["audio", "learning", "text-to-speech", "spaced-repetition", "pdf"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "pysbd>=0.3.4",
]

[project.optional-dependencies]
epub = ["ebooklib>=0.18", "beautifulsoup4>=4.12", "lxml>=5.2"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
    "reportlab>=4.2",          # builds the synthetic PDF fixtures
]

[project.scripts]
mimem = "mimem.cli:app"

[project.urls]
Homepage = "https://github.com/jepegit/mimem"

[tool.hatch.build.targets.wheel]
packages = ["src/mimem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: takes more than a second"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
# These modules exist precisely to handle typographic characters -- soft hyphens, en dashes,
# ligatures, minus signs, Greek letters. RUF001 flags exactly the characters they must match.
"src/mimem/clean/dehyphenate.py" = ["RUF001"]
"src/mimem/clean/extraction.py" = ["RUF001"]
"src/mimem/clean/merge.py" = ["RUF001"]
"src/mimem/clean/sections.py" = ["RUF001"]
"src/mimem/clean/sentences.py" = ["RUF001"]
"src/mimem/ingest/pdf.py" = ["RUF001"]
# The verbalizers are the whole reason those characters need handling at all: Greek letters,
# minus signs, multiplication signs, en dashes and typographic quotes are their subject matter.
"src/mimem/verbalize/__init__.py" = ["RUF002"]
"src/mimem/verbalize/citations.py" = ["RUF001"]
"src/mimem/verbalize/numbers.py" = ["RUF001", "RUF002"]
"src/mimem/verbalize/symbols.py" = ["RUF001", "RUF002"]
"src/mimem/verbalize/units.py" = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# Strictness is applied where types actually prevent bugs; the adapter layer talks to
# untyped third-party libraries and is checked less aggressively.
files = ["src/mimem"]

[[tool.mypy.overrides]]
module = ["fitz.*", "pysbd.*", "ebooklib.*", "bs4.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mimem.ingest.*"]
disallow_untyped_calls = false
