[project]
site_url = "https://jepegit.github.io/mimem/"
site_name = "mimem"
site_description = "Turn a paper into audio you actually remember"
site_author = "Jan Petter Maehlen"

copyright = "Built in the open. The research it rests on belongs to the people who did it."

repo_url = "https://github.com/jepegit/mimem"
repo_name = "jepegit/mimem"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Listening" = [
    "listening/index.md",
    "listening/assistant.md",
    "listening/install.md",
    "listening/first-paper.md",
    "listening/audio.md",
    "listening/tuning.md",
  ] },
  { "Using a model" = [
    "ai/index.md",
    "ai/no-key.md",
    "ai/local.md",
    "ai/api.md",
  ] },
  { "The science" = [
    "science/index.md",
    "knowledge-base/README.md",
    "knowledge-base/01-core-effects.md",
    "knowledge-base/02-audio-constraints.md",
    "knowledge-base/03-elaboration-and-imagery.md",
    "knowledge-base/04-structure-and-attention.md",
    "knowledge-base/05-verbalizing-nonprose.md",
    "knowledge-base/99-sources.md",
  ] },
  { "Building it" = [
    "building/index.md",
    "building/stages.md",
    "building/extending.md",
    "DESIGN-RULES.md",
    "PLAN-part1.md",
    "PLAN-assistant.md",
    "PLAN-figures.md",
    "PLAN-ai.md",
  ] },
  { "Reference" = [
    "reference/cli.md",
    "reference/artefacts.md",
    "examples/programme.md",
    "examples/sample-output.md",
  ] },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/audio-lines"

[project.theme.font]
text = "Source Sans 3"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/jepegit/mimem"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
